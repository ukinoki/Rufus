name: Publication des releases (Windows / macOS / Linux)

# Déclenchement :
#   • push d'un tag « v* » (ex. v10-06-2026)  → build + publication de la Release ;
#   • bouton « Run workflow » (workflow_dispatch) → build + artefacts, SANS Release.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Chaque nouveau push annule le run précédent encore en cours (économie de minutes).
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

# Nécessaire pour que l'étape de publication crée/complète la Release.
permissions:
  contents: write

env:
  QT_VERSION: '6.10.2'       # aligné sur la version de compilation locale

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  #  Extrait la version (= date de publication) depuis rufus.cpp, source unique.
  # ───────────────────────────────────────────────────────────────────────────
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: get
        shell: bash
        run: |
          # qApp->setApplicationVersion("10-06-2026/1")  →  10-06-2026
          V=$(grep -oP 'setApplicationVersion\("\K[^"/]+' rufus.cpp | head -n1)
          echo "version=${V}" >> "$GITHUB_OUTPUT"
          echo "Version détectée : ${V}"

  # ───────────────────────────────────────────────────────────────────────────
  #  LINUX → AppImage auto-installante (Rufus-<version>-x86_64.AppImage)
  # ───────────────────────────────────────────────────────────────────────────
  linux:
    needs: version
    runs-on: ubuntu-22.04      # cible « anciennes machines » : glibc raisonnable
    steps:
      - uses: actions/checkout@v4

      - name: Installer Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          modules: 'qtmultimedia qtpdf qtserialport'

      - name: Dépendances système (client MySQL/MariaDB, FUSE pour AppImage, outils)
        run: |
          sudo apt-get update
          # Le plugin qsqlmysql se lie au client MariaDB OU MySQL → on installe les
          # deux bibliothèques RUNTIME (sans les -dev, qui se déclarent mutuellement
          # « Conflicts » et feraient échouer apt) pour qu'il se charge au runtime,
          # quel que soit celui contre lequel Qt a été construit. linuxdeployqt
          # embarquera ensuite la lib utile dans l'AppImage.
          sudo apt-get install -y \
            libmariadb3 libmysqlclient21 \
            libfuse2 libgl1-mesa-dev libxkbcommon-dev

      - name: Compiler (qmake + make, Release)
        run: |
          qmake RufusQt6.pro CONFIG+=release
          make -j"$(nproc)"

      - name: Construire l'AppImage
        run: |
          set -e
          VER='${{ needs.version.outputs.version }}'
          # Localiser le binaire produit (le nom exact peut varier).
          BIN=$(find . -maxdepth 2 -type f -executable \
                 \( -name 'Rufus*' -o -name 'RufusQt6*' \) ! -name '*.so*' | head -n1)
          echo "Binaire : $BIN"

          # Arborescence AppDir
          mkdir -p AppDir/usr/bin \
                   AppDir/usr/share/applications \
                   AppDir/usr/share/icons/hicolor/256x256/apps
          cp "$BIN" AppDir/usr/bin/Rufus
          cp build_tools/Linux/rufus.png AppDir/usr/share/icons/hicolor/256x256/apps/rufus.png
          cat > AppDir/usr/share/applications/rufus.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=Rufus
          Exec=Rufus
          Icon=rufus
          Comment=Logiciel de gestion de cabinet d'Ophtalmologie
          Categories=Office;
          Terminal=false
          EOF

          # Bundling Qt avec linuxdeploy + plugin Qt (outil moderne et maintenu). Le build
          # « continuous » de linuxdeployqt sortait en erreur AVANT de déployer Qt -> AppImage
          # vide ; linuxdeploy est fiable pour Qt6. On garde notre AppRun auto-installant
          # (il remplace, plus bas, celui généré par linuxdeploy).
          export APPIMAGE_EXTRACT_AND_RUN=1          # lancer les outils-AppImage sans FUSE
          export PATH="$PWD:$PATH"                   # pour que linuxdeploy trouve son plugin Qt
          export QMAKE="$QT_ROOT_DIR/bin/qmake"      # le plugin Qt localise Qt via qmake
          export EXTRA_QT_PLUGINS="sqldrivers"       # forcer l'embarquement du pilote qsqlmysql
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-qt-x86_64.AppImage
          ./linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --executable AppDir/usr/bin/Rufus \
            --desktop-file AppDir/usr/share/applications/rufus.desktop \
            --icon-file AppDir/usr/share/icons/hicolor/256x256/apps/rufus.png \
            --plugin qt

          # Notre AppRun (fait de l'AppImage un installeur, cf. build_tools/Linux/AppRun)
          cp build_tools/Linux/AppRun AppDir/AppRun
          chmod +x AppDir/AppRun

          # appimagetool exige l'icône à la RACINE de l'AppDir (Icon=rufus du .desktop),
          # en plus de celle sous usr/share/icons. On la copie nous-mêmes par sécurité.
          cp build_tools/Linux/rufus.png AppDir/rufus.png

          # Empaquetage final avec appimagetool (ARCH explicite : appimagetool ne
          # sait pas la deviner depuis l'AppDir et échoue sinon).
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          ARCH=x86_64 ./appimagetool-x86_64.AppImage AppDir "Rufus-${VER}-x86_64.AppImage"

          # Garde-fou : une AppImage complète (binaire + Qt) pèse des dizaines de Mo.
          # Si elle est ridiculement petite, c'est que le bundling Qt a échoué — on
          # ne laisse PLUS passer un faux vert (bundling Qt incomplet = AppImage vide).
          SZ=$(stat -c%s "Rufus-${VER}-x86_64.AppImage")
          echo "Taille AppImage : $SZ octets"
          if [ "$SZ" -lt 20000000 ]; then
            echo "::error::AppImage anormalement petite ($SZ octets) : le bundling Qt a échoué."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: Rufus-Linux-AppImage
          path: 'Rufus-*-x86_64.AppImage'

  # ───────────────────────────────────────────────────────────────────────────
  #  WINDOWS → RufusSetup.exe (Inno Setup)
  # ───────────────────────────────────────────────────────────────────────────
  windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installer Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2022_64
          modules: 'qtmultimedia qtpdf qtserialport'

      - name: Environnement MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Compiler (qmake + nmake, Release)
        shell: cmd
        run: |
          qmake RufusQt6.pro CONFIG+=release
          nmake

      - name: Déployer (windeployqt + assets + client MySQL)
        shell: pwsh
        run: |
          $deploy = "$env:GITHUB_WORKSPACE\Deploy"
          New-Item -ItemType Directory -Force -Path $deploy | Out-Null
          # Localiser Rufus.exe (sortie Release)
          $exe = Get-ChildItem -Recurse -Filter Rufus.exe |
                 Where-Object { $_.FullName -notlike '*\Deploy\*' } | Select-Object -First 1
          Copy-Item $exe.FullName "$deploy\Rufus.exe"
          windeployqt --release --compiler-runtime --sql "$deploy\Rufus.exe"
          # Assets de l'application
          Copy-Item -Recurse -Force assets "$deploy\assets"
          # Client MySQL (mysql.exe / mysqldump.exe + libmysql.dll) — best-effort.
          # TODO 1er run : vérifier le chemin du client MySQL sur le runner.
          choco install mysql --no-progress -y | Out-Null

      - name: Construire RufusSetup.exe (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y | Out-Null
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc /DMyAppVersion="${{ needs.version.outputs.version }}" `
                  /DDeploySrc="$env:GITHUB_WORKSPACE\Deploy" `
                  build_tools\Windows\RufusVision.iss
          # ISCC produit RufusSetup.exe dans le dossier Output\ à côté du .iss.
          Get-ChildItem -Recurse -Filter RufusSetup.exe | ForEach-Object {
            Copy-Item $_.FullName "$env:GITHUB_WORKSPACE\Rufus-${{ needs.version.outputs.version }}-Setup.exe" }

      - uses: actions/upload-artifact@v4
        with:
          name: Rufus-Windows-Setup
          path: 'Rufus-*-Setup.exe'

  # ───────────────────────────────────────────────────────────────────────────
  #  macOS → Rufus-<version>.dmg
  # ───────────────────────────────────────────────────────────────────────────
  macos:
    needs: version
    # macos-14 (Apple Silicon) : runners bien plus disponibles que macos-13. On y
    # produit malgré tout un binaire UNIVERSEL (x86_64 + arm64) — l'architecture x64
    # ne doit PAS être abandonnée (vieux Macs Intel). Qt macOS officiel étant déjà
    # universel, la tranche x86_64 est simplement cross-compilée (standard).
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Installer Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          modules: 'qtmultimedia qtpdf qtserialport'

      - name: Client MariaDB/MySQL (lib du pilote qsqlmysql)
        run: brew install mariadb-connector-c || brew install mysql-client

      - name: Compiler (qmake + make, Release, binaire universel)
        run: |
          qmake RufusQt6.pro CONFIG+=release "QMAKE_APPLE_DEVICE_ARCHS=x86_64 arm64"
          make -j"$(sysctl -n hw.ncpu)"

      - name: Construire le pkg (avec pré-contrôle MySQL)
        run: |
          set -e
          chmod +x build_tools/macOS/create-rufus-pkg.sh build_tools/macOS/preinstall
          APP=$(find . -maxdepth 3 -type d -name '*.app' | head -n1)
          echo "Bundle : $APP"
          build_tools/macOS/create-rufus-pkg.sh "$APP" \
            '${{ needs.version.outputs.version }}' "$GITHUB_WORKSPACE"

      - uses: actions/upload-artifact@v4
        with:
          name: Rufus-macOS-pkg
          path: 'Rufus-*.pkg'

  # ───────────────────────────────────────────────────────────────────────────
  #  Publication : uniquement sur tag « v* » → Release GitHub avec les 3 paquets.
  # ───────────────────────────────────────────────────────────────────────────
  release:
    needs: [version, linux, windows, macos]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artefacts
      - name: Publier la Release
        uses: softprops/action-gh-release@v2
        with:
          name: Rufus ${{ needs.version.outputs.version }}
          files: artefacts/**/*
          generate_release_notes: true
